# VaticTrader: one-click Render Blueprint.
# Only the web service + Postgres are created. No questions are asked at deploy time.
# Optional integrations (Stripe, email, Telegram, AI) are added later in
# Render > Environment, or (Stripe and AI keys) inside the app's Admin panel.
services:
  - type: web
    name: vatictrader
    runtime: node
    region: oregon          # must match the database region below
    plan: starter
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: vatictrader-db
          property: connectionString   # Internal URL, private network
      - key: PGSSLMODE
        value: require
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STRIPE_PRICE_ID_STARTER
        value: price_1UOcdHFqWk14rBGjArCGpNxw
      - key: STRIPE_PRICE_ID_PRO
        value: price_1UOcdJFqWk14rBGjy8UQz9YE

databases:
  - name: vatictrader-db
    region: oregon          # same region as the web service
    plan: basic-256mb
    databaseName: vatictrader
    user: vatictrader
    ipAllowList: []         # internal access only
